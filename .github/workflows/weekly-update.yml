name: Biophysics weekly update

on:
  schedule:
    # 09:00 Eastern during daylight saving time; 08:00 during standard time.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      regenerate_current:
        description: "Re-filter and replace the current edition from its frozen candidates"
        required: false
        default: false
        type: boolean
      repair_current:
        description: "Remove invalid papers from the current frozen edition without making AI calls"
        required: false
        default: false
        type: boolean
      send_correction:
        description: "Send the current edition again as a corrected delivery"
        required: false
        default: false
        type: boolean
      skip_email:
        description: "Publish the corrected website edition without sending email"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: biophysics-weekly-update
  cancel-in-progress: false

jobs:
  build-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the paper pipeline
        uses: actions/checkout@v4

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Test paper pipeline
        run: julia --project=. -e 'include(joinpath("test", "feedback_scoring.jl")); include(joinpath("test", "biorxiv_fetching.jl")); include(joinpath("test", "journal_fallbacks.jl")); include(joinpath("test", "edition_integrity.jl"))'

      - name: Determine whether this edition is already frozen
        id: edition
        shell: bash
        run: |
          DAY_OFFSET="$(( $(date -u +%u) - 1 ))"
          EDITION_ID="$(date -u -d "$DAY_OFFSET days ago" '+%Y-%m-%d')"
          ARCHIVE_FILE="$(date -u -d "$EDITION_ID" '+PreviousWeeks/%b%d_%Y.qmd')"
          PAPER_DATA_FILE="${ARCHIVE_FILE%.qmd}.papers.json"

          echo "edition_id=$EDITION_ID" >> "$GITHUB_OUTPUT"
          echo "archive_file=$ARCHIVE_FILE" >> "$GITHUB_OUTPUT"
          echo "paper_data_file=$PAPER_DATA_FILE" >> "$GITHUB_OUTPUT"

          if [ -s "$ARCHIVE_FILE" ] && [ -s "$PAPER_DATA_FILE" ]; then
            if [ "${{ inputs.repair_current || false }}" = "true" ]; then
              cp "$ARCHIVE_FILE" papers_final.md
              cp "$PAPER_DATA_FILE" papers.json
              echo "reused=false" >> "$GITHUB_OUTPUT"
              echo "regenerated_from_frozen=false" >> "$GITHUB_OUTPUT"
              echo "repaired_from_frozen=true" >> "$GITHUB_OUTPUT"
              echo "Repairing the frozen $EDITION_ID edition from its existing decisions without AI calls."
            elif [ "${{ inputs.regenerate_current || false }}" = "true" ]; then
              cp "$PAPER_DATA_FILE" papers.json
              echo "reused=false" >> "$GITHUB_OUTPUT"
              echo "regenerated_from_frozen=true" >> "$GITHUB_OUTPUT"
              echo "repaired_from_frozen=false" >> "$GITHUB_OUTPUT"
              echo "Re-filtering the frozen $EDITION_ID candidate set without scraping or duplicate removal."
            else
              cp "$ARCHIVE_FILE" papers_final.md
              cp "$PAPER_DATA_FILE" papers.json
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "regenerated_from_frozen=false" >> "$GITHUB_OUTPUT"
              echo "repaired_from_frozen=false" >> "$GITHUB_OUTPUT"
              echo "Reusing the frozen $EDITION_ID edition for this rerun."
            fi
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "regenerated_from_frozen=false" >> "$GITHUB_OUTPUT"
            echo "repaired_from_frozen=false" >> "$GITHUB_OUTPUT"
            echo "No frozen $EDITION_ID edition exists; generating it now."
          fi

      - name: Check required configuration
        if: ${{ steps.edition.outputs.reused != 'true' && steps.edition.outputs.repaired_from_frozen != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi

      - name: Fetch current papers
        if: ${{ steps.edition.outputs.reused != 'true' && steps.edition.outputs.regenerated_from_frozen != 'true' && steps.edition.outputs.repaired_from_frozen != 'true' }}
        env:
          FETCH_CLEAN: "1"
          EDITION_ID: ${{ steps.edition.outputs.edition_id }}
        run: julia --project=. fetch_papers.jl

      - name: Stop before publishing an incomplete scrape
        if: ${{ success() && steps.edition.outputs.reused != 'true' && steps.edition.outputs.regenerated_from_frozen != 'true' && steps.edition.outputs.repaired_from_frozen != 'true' }}
        run: |
          if [ ! -s fetch_warnings.json ]; then
            exit 0
          fi
          echo "At least one source remained unavailable after retries. Refusing to freeze or email an incomplete edition."
          cat fetch_warnings.json
          exit 1

      - name: Download anonymous reader voting feedback
        if: ${{ steps.edition.outputs.reused != 'true' && steps.edition.outputs.repaired_from_frozen != 'true' }}
        env:
          NEWSLETTER_API_URL: ${{ secrets.NEWSLETTER_API_URL }}
          NEWSLETTER_ADMIN_TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
        run: |
          mkdir -p TrainingData
          if [ -z "$NEWSLETTER_API_URL" ] || [ -z "$NEWSLETTER_ADMIN_TOKEN" ]; then
            echo '{"papers":[]}' > TrainingData/reader_feedback.json
            echo "Reader feedback is unavailable because the newsletter API is not configured."
            exit 0
          fi

          if ! curl --fail-with-body --silent --show-error \
            "$NEWSLETTER_API_URL/admin/feedback-export" \
            -H "Authorization: Bearer $NEWSLETTER_ADMIN_TOKEN" \
            -o TrainingData/reader_feedback.json; then
            echo '{"papers":[]}' > TrainingData/reader_feedback.json
            echo "Reader feedback could not be downloaded; continuing without it."
          fi
          if ! jq -e '.papers | type == "array"' TrainingData/reader_feedback.json > /dev/null; then
            echo '{"papers":[]}' > TrainingData/reader_feedback.json
            echo "Reader feedback was malformed; continuing without it."
          fi

      - name: Filter and summarize papers
        if: ${{ steps.edition.outputs.reused != 'true' && steps.edition.outputs.repaired_from_frozen != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITION_ID: ${{ steps.edition.outputs.edition_id }}
        run: julia --project=. filter_papers.jl

      - name: Repair a frozen edition without AI calls
        if: ${{ steps.edition.outputs.repaired_from_frozen == 'true' }}
        env:
          EDITION_ID: ${{ steps.edition.outputs.edition_id }}
        run: julia --project=. repair_frozen_edition.jl

      - name: Validate edition integrity
        env:
          EDITION_ID: ${{ steps.edition.outputs.edition_id }}
          MIN_EDITION_PAPERS: "50"
        run: julia --project=. validate_edition.jl

      - name: Save the generated edition
        uses: actions/upload-artifact@v4
        with:
          name: biophysics-weekly-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            papers.json
            papers_final.md
            paper_scores.json
            fetch_warnings.json
            TrainingData/reader_feedback.json
            TrainingData/filter_decisions_*.jsonl

      - name: Freeze a newly generated edition before delivery
        if: ${{ steps.edition.outputs.reused != 'true' }}
        env:
          ARCHIVE_FILE: ${{ steps.edition.outputs.archive_file }}
          PAPER_DATA_FILE: ${{ steps.edition.outputs.paper_data_file }}
          EDITION_ID: ${{ steps.edition.outputs.edition_id }}
        run: |
          DECISION_FILE="TrainingData/filter_decisions_${EDITION_ID}.jsonl"
          test -s "$DECISION_FILE"
          cp papers_final.md "$ARCHIVE_FILE"
          cp papers.json "$PAPER_DATA_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DECISION_FILE" "$ARCHIVE_FILE" "$PAPER_DATA_FILE"
          if git diff --cached --quiet; then
            echo "The frozen edition is already committed."
            exit 0
          fi
          git commit -m "Save Biophysics Weekly learning data for $EDITION_ID"
          git push

      - name: Email the edition to active subscribers
        if: ${{ inputs.skip_email != true }}
        env:
          NEWSLETTER_API_URL: ${{ secrets.NEWSLETTER_API_URL }}
          NEWSLETTER_ADMIN_TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
        run: |
          if [ -z "$NEWSLETTER_API_URL" ] || [ -z "$NEWSLETTER_ADMIN_TOKEN" ]; then
            echo "Newsletter delivery is not active: NEWSLETTER_API_URL or NEWSLETTER_ADMIN_TOKEN is missing."
            exit 1
          fi

          EDITION_ID="${{ steps.edition.outputs.edition_id }}"
          SUBJECT="$(date -u -d "$EDITION_ID" '+Biophysics Weekly Update — Week of %B %-d, %Y')"
          DELIVERY_SUBJECT="$SUBJECT"
          DELIVERY_ID="$EDITION_ID"
          REPLACE_FROZEN="false"
          if [ "${{ inputs.send_correction || false }}" = "true" ] || [ "${{ inputs.regenerate_current || false }}" = "true" ] || [ "${{ inputs.repair_current || false }}" = "true" ]; then
            DELIVERY_ID="${EDITION_ID}-correction-${{ github.run_number }}"
            DELIVERY_SUBJECT="Correction — $SUBJECT"
            REPLACE_FROZEN="true"
          fi
          jq -n \
            --arg editionId "$EDITION_ID" \
            --arg deliveryId "$DELIVERY_ID" \
            --arg subject "$SUBJECT" \
            --arg deliverySubject "$DELIVERY_SUBJECT" \
            --argjson replaceFrozenEdition "$REPLACE_FROZEN" \
            --rawfile markdown papers_final.md \
            --slurpfile paperMetadata papers.json \
            '{editionId:$editionId,deliveryId:$deliveryId,replaceFrozenEdition:$replaceFrozenEdition,subject:$subject,deliverySubject:$deliverySubject,markdown:$markdown,paperMetadata:$paperMetadata[0]}' > newsletter-payload.json

          curl --fail-with-body "$NEWSLETTER_API_URL/admin/send-edition" \
            -H "Authorization: Bearer $NEWSLETTER_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @newsletter-payload.json

      - name: Email the owner if the weekly run failed
        if: ${{ failure() }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WARNING_EMAIL: ${{ secrets.WARNING_EMAIL }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$WARNING_EMAIL" ]; then
            echo "Warning email not sent: RESEND_API_KEY or WARNING_EMAIL is not configured."
            exit 0
          fi

          FROM_ADDRESS="${RESEND_FROM:-Biophysics Weekly <onboarding@resend.dev>}"
          SUBJECT="Biophysics Weekly run failed"
          DETAILS="At least one fetch, filter, delivery, or publishing step did not complete."
          if [ -s fetch_warnings.json ]; then
            WARNINGS="$(jq -r '.[] | "• " + .' fetch_warnings.json)"
            SUBJECT="Biophysics Weekly scrape incomplete"
            DETAILS="The scrape remained incomplete after automatic retries:<br><pre>$WARNINGS</pre>"
          fi
          jq -n \
            --arg from "$FROM_ADDRESS" \
            --arg to "$WARNING_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg html "<h1>The weekly paper run needs attention</h1><p>$DETAILS</p><p>It is safe to re-run the workflow. An unfinished edition will be rebuilt; a previously frozen edition will be reused exactly, and subscribers who already received it will be skipped.</p><p><a href=\"$RUN_URL\">Open the GitHub run, inspect the failure, and re-run the workflow</a>.</p>" \
            '{from:$from,to:[$to],subject:$subject,html:$html}' > resend-warning.json

          curl --fail-with-body https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @resend-warning.json
